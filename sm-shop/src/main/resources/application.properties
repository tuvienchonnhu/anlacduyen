#Spring boot configurations
#logging.config=log4j-shopizer.properties
server.port=8080


#Turn Statistics on
#spring.jpa.properties.hibernate.generate_statistics=true
#default database schema
spring.jpa.properties.hibernate.default_schema=SALESMANAGER
#logging.level.org.hibernate.stat=debug

# Enable logging to verify that HikariCP is used, the second entry is specific to HikariCP
logging.level.org.hibernate.SQL=INFO
logging.level.com.zaxxer.hikari.HikariConfig=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO


#AI germini 1.5 flash
# Nha cung cap AI mac dinh khi chua cau hinh trong Admin > Configuration: gemini, openai, groq hoac cerebras
ai.provider=gemini
googleai.gemini.apikey=your_apikey
googleai.gemini.model=gemini-3.5-flash
# Du phong cho OpenAI (chi dung khi AI_PROVIDER = openai va chua co key trong DB)
openai.apikey=your_apikey
openai.model=gpt-4o-mini
# Du phong cho Groq (chi dung khi AI_PROVIDER = groq va chua co key trong DB)
groq.apikey=your_apikey
groq.model=llama-3.3-70b-versatile
# Du phong cho Cerebras (chi dung khi AI_PROVIDER = cerebras va chua co key trong DB)
# Model mac dinh: gpt-oss-120b (cac model cu nhu llama3.1-8b da bi Cerebras go bo)
cerebras.apikey=your_apikey
cerebras.model=gpt-oss-120b
