security.group.description.SUPERADMIN=Chỉ một người dùng có thể là Quản trị viên tối cao (Superadmin). Người dùng admin được tạo mặc định là Superadmin. Người dùng này có toàn quyền trong hệ thống và là người duy nhất quản lý các cửa hàng.
security.group.description.ADMIN=Người dùng Admin có hầu hết các quyền quản trị cửa hàng. Admin có thể làm mọi thứ như Quản lý cửa hàng (Store Manager) và có thể tạo người dùng với các quyền hạn chế hơn.
security.group.description.ADMIN_CATALOGUE=Người dùng thuộc nhóm này có thể tạo sản phẩm, danh mục và các sản phẩm nổi bật.
security.group.description.ADMIN_STORE=Người dùng thuộc nhóm này có thể quản lý cửa hàng được phân công. Có thể thay đổi thương hiệu và chỉnh sửa mọi thứ trong menu cửa hàng. Nhóm này cũng cho phép cấu hình vận chuyển và thanh toán.
security.group.description.ADMIN_ORDER=Người dùng thuộc nhóm này có thể quản lý đơn hàng, tìm kiếm đơn hàng, thay đổi thông tin khách hàng, hoàn tiền cho đơn hàng.
security.group.description.ADMIN_CONTENT=Người dùng thuộc nhóm này có thể quản lý nội dung động và tĩnh của website, thêm hình ảnh và tệp vào hệ thống.

